# api.sizor.online → Express en 127.0.0.1:3101
# (3001 ya lo usa otra app en producción en este VPS)

upstream sizor_api {
    server 127.0.0.1:3101;
    keepalive 32;
}

map $http_upgrade $connection_upgrade_sizor_api {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.sizor.online;

    client_max_body_size 50m;

    location / {
        proxy_pass http://sizor_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_sizor_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
