<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; background-color: #f5f5f5;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%"
        style="max-width: 600px; margin: 20px auto; background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); overflow: hidden;">

        <tr>
            <td
                style="padding: 50px 40px; background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%); text-align: center;">
                <h1 style="color: #ffffff; font-size: 28px; margin: 0 0 10px 0; font-weight: 600;">{{title}}</h1>
                <p style="color: #e0e0e0; font-size: 16px; margin: 0;">{{description}}</p>
            </td>
        </tr>

        <tr>
            <td style="padding: 40px 40px 30px 40px;">
                <div style="color: #4a4a4a; font-size: 16px; line-height: 1.7; margin-bottom: 30px;">
                    <p style="margin: 0 0 16px 0;">{{content}}</p>
                </div>

                <div style="background-color: #f8f9fa; padding: 25px; border-radius: 8px; margin-bottom: 30px;">
                    <h3 style="color: #1a1a1a; font-size: 18px; margin: 0 0 15px 0; font-weight: 600;">Información</h3>
                    <!-- Mapear los datos del objeto data -->
                    <ul style="color: #4a4a4a; font-size: 15px; line-height: 1.6; margin: 0; padding-left: 20px;">
                        {{#each data}}
                        <li style="margin-bottom: 8px;">{{this.label}}: {{this.value}}</li>
                        {{/each}}
                    </ul>
                </div>
            </td>
        </tr>

        <tr>
            <td
                style="background-color: #f8f9fa; padding: 25px 40px; text-align: center; border-top: 1px solid #eeeeee;">
                <p style="color: #1a1a1a; font-size: 16px; font-weight: 600; margin: 0 0 5px 0;">
                    Equipo de {{app_name}}
                </p>
            </td>
        </tr>
    </table>
</body>

</html>
