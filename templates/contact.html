<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; background-color: #f5f5f5;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%"
        style="max-width: 600px; margin: 20px auto; background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); overflow: hidden;">

        <!-- Header -->
        <tr>
            <td
                style="padding: 40px 40px; background: linear-gradient(135deg, #2196f3 0%, #1976d2 100%); text-align: center;">
                <div
                    style="background-color: #ffffff; width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 20px auto; display: flex; align-items: center; justify-content: center;">
                    <span style="color: #2196f3; font-size: 30px;">💬</span>
                </div>
                <h1 style="color: #ffffff; font-size: 24px; margin: 0 0 10px 0; font-weight: 600;">Nuevo Mensaje de
                    Contacto</h1>
                <p style="color: #e3f2fd; font-size: 14px; margin: 0;">Desde la página web de {{app_name}}</p>
            </td>
        </tr>

        <!-- Content -->
        <tr>
            <td style="padding: 40px 40px;">
                <h2 style="color: #1a1a1a; font-size: 20px; margin: 0 0 25px 0; font-weight: 600;">Información del
                    Contacto</h2>

                <!-- Contact Details Card -->
                <div
                    style="background-color: #f8f9fa; padding: 25px; border-radius: 8px; border-left: 4px solid #2196f3; margin-bottom: 30px;">
                    <table style="width: 100%; border-collapse: collapse;">
                        <tr>
                            <td style="padding: 12px 0; color: #6a6a6a; font-size: 14px; font-weight: 600; width: 25%;">
                                Nombre:</td>
                            <td style="padding: 12px 0; color: #1a1a1a; font-size: 16px; font-weight: 500;">
                                {{name}}</td>
                        </tr>
                        <tr>
                            <td style="padding: 12px 0; color: #6a6a6a; font-size: 14px; font-weight: 600;">Correo:</td>
                            <td style="padding: 12px 0; color: #1a1a1a; font-size: 16px;">
                                <a href="mailto:{{email}}" style="color: #2196f3; text-decoration: none;">{{email}}</a>
                            </td>
                        </tr>
                    </table>
                </div>

                <!-- Message Section -->
                <h3 style="color: #1a1a1a; font-size: 16px; margin: 0 0 12px 0; font-weight: 600;">Mensaje:</h3>
                <div
                    style="background-color: #ffffff; padding: 20px; border-radius: 8px; border: 1px solid #e0e0e0; margin-bottom: 30px;">
                    <p
                        style="color: #4a4a4a; font-size: 15px; line-height: 1.7; margin: 0; white-space: pre-wrap; word-wrap: break-word;">
                        {{description}}</p>
                </div>

                <!-- Action Section -->
                <div style="text-align: center;">
                    <a href="mailto:{{email}}"
                        style="display: inline-block; background: linear-gradient(135deg, #2196f3 0%, #1976d2 100%); color: #ffffff; text-decoration: none; padding: 12px 35px; border-radius: 6px; font-size: 15px; font-weight: 600; box-shadow: 0 2px 10px rgba(33,150,243,0.3);">
                        Responder
                    </a>
                </div>
            </td>
        </tr>

        <!-- Footer -->
        <tr>
            <td
                style="background-color: #f8f9fa; padding: 20px 40px; text-align: center; border-top: 1px solid #eeeeee;">
                <p style="color: #1a1a1a; font-size: 14px; font-weight: 600; margin: 0 0 3px 0;">
                    {{app_name}}
                </p>
                <p style="color: #6a6a6a; font-size: 12px; margin: 0;">
                    Mensaje recibido desde el formulario de contacto de {{app_name}}
                </p>
            </td>
        </tr>
    </table>
</body>

</html>
