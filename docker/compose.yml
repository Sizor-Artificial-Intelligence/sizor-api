name: sizor-api

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq
    restart: unless-stopped
    expose:
      - "5672"
      - "15672"
    environment:
      TZ: America/Bogota
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/sizor-artificial-intelligence/sizor-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "3001"
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      TZ: America/Bogota
      DATABASE_HOST: host.docker.internal
      IP_ADDRESS_VPS: rabbitmq
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: sizor-api-nginx:latest
    pull_policy: build
    restart: unless-stopped
    environment:
      TZ: America/Bogota
    ports:
      - "5001:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/nginx-health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      app:
        condition: service_healthy

volumes:
  rabbitmq_data:
